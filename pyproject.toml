[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptvlm"
version = "0.1.0"
description = "Reproducible small vision-language model baselines"
requires-python = ">=3.11"
dependencies = ["Pillow>=10.4,<12", "PyYAML>=6.0.2,<7", "numpy>=1.26,<3"]

[project.optional-dependencies]
model = ["torch>=2.5,<2.8", "torchvision>=0.20,<0.23", "transformers==4.51.3", "accelerate>=1.2,<2", "huggingface-hub>=0.30,<1"]
app = ["gradio>=5.23,<6"]
training = ["peft==0.15.2", "torch>=2.5,<2.8", "transformers==4.51.3", "accelerate>=1.2,<2"]
dev = ["pytest>=8,<9", "ruff>=0.11,<0.12"]

[project.scripts]
adaptvlm = "adaptvlm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
extend-exclude = [".cache", ".venv"]
