name: CPU checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e ".[dev,app,model,training,dpo,benchmark]"
      - run: ruff check .
      - run: pytest -q
        env:
          GRADIO_ANALYTICS_ENABLED: 'False'
      - run: python scripts/evaluate.py --config configs/mock.yaml --output reports/smoke.json
